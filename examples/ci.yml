name: StateBreak example
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install .
      - run: statebreak validate scenarios
      - run: statebreak run scenarios --agent guarded --format markdown --output statebreak.md
